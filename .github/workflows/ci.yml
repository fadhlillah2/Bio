name: CI

# Pull requests get the same gate that guards the deploy on master (deploy.yml), so a change is
# validated before it can merge instead of after. Nothing here deploys or reads a secret.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install poppler-utils
        # pdftoppm rasterises cv/*.pdf for the ink/scale gate in check:cv; the runner image ships none
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Validate
        timeout-minutes: 10
        run: |
          python3 --version
          pdftoppm -v
          bun -e 'import { findChrome } from "./cv/build-pdf.ts"; console.log(findChrome())'
          bun run validate:ci
