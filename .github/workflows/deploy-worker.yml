name: Deploy chat worker

on:
  push:
    branches: [master]
    paths:
      - worker/**
      - scripts/chat-core.ts
      - scripts/chat-proxy.ts
      - scripts/chat-worker-build.ts
      - cv/resume-v*.txt
      - .opencode/agent/bio-guide.md
      - src/lib/components/About.svelte
      - src/lib/components/Hero.svelte
      - src/lib/components/Resume.svelte
      - src/lib/components/Portfolio.svelte
      - src/lib/components/HomeHead.svelte
      - src/lib/components/Services.svelte
      - src/lib/components/Skills.svelte
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preflight — credentials and KV id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          CHAT_SIGNING_KEY: ${{ secrets.CHAT_SIGNING_KEY }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          [ -n "$CHAT_API_KEY" ] || { echo "::error::GitHub secret CHAT_API_KEY is not set"; exit 1; }
          [ -n "$CHAT_SIGNING_KEY" ] || { echo "::error::GitHub secret CHAT_SIGNING_KEY is not set"; exit 1; }
          if grep -q PASTE_THE_ID_FROM_wrangler_kv_namespace_create worker/wrangler.toml; then
            echo "::error::worker/wrangler.toml still holds the KV namespace placeholder — create CHAT_KV and paste the id"
            exit 1
          fi

      - name: Content gate — generated bundle matches its sources
        run: bun scripts/chat-worker-build.ts --check

      - name: Guard selftest — origin, HMAC, quota, limits
        run: bun scripts/chat-proxy-selftest.ts

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          secrets: |
            CHAT_API_KEY
            CHAT_SIGNING_KEY
        env:
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          CHAT_SIGNING_KEY: ${{ secrets.CHAT_SIGNING_KEY }}
