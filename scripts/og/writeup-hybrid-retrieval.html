<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG cover — writeup: hybrid retrieval</title>
<style>
  /* Rendered at exactly 1200×630 by scripts/og-render.ts. Title/deck mirror the writeup route. */
  @font-face { font-family: "Instrument Sans"; src: url("../../static/assets/fonts/instrument-sans-var.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "JetBrains Mono"; src: url("../../static/assets/fonts/jetbrains-mono-var.woff2") format("woff2"); font-weight: 400 700; }

  :root {
    --ink-0: #070a10; --ink-2: #10151f; --line: #1e2632; --line-2: #2b3648;
    --head: #eef2f8; --bright: #d5dde8; --text: #a8b3c2; --muted: #788394;
    --accent: #5ce1c6; --metric: #f2c078;
    --sans: "Instrument Sans", sans-serif; --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(900px 520px at 82% 0%, rgba(92, 225, 198, 0.13), transparent 62%),
      radial-gradient(700px 460px at 0% 100%, rgba(242, 192, 120, 0.07), transparent 60%),
      var(--ink-0);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(168, 179, 194, 0.13) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 72%);
  }
  .eyebrow {
    position: absolute; left: 64px; right: 64px; top: 56px;
    display: flex; align-items: center; gap: 16px;
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }

  h1 { position: absolute; left: 64px; top: 124px; width: 640px; font-size: 58px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; color: var(--head); }
  .deck { position: absolute; left: 64px; top: 326px; width: 700px; font-size: 24px; line-height: 1.32; letter-spacing: -0.01em; color: var(--text); }
  .pill { position: absolute; left: 64px; top: 414px; padding: 12px 18px; font-family: var(--mono); font-size: 15px; color: var(--bright); background: var(--ink-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; white-space: nowrap; }
  .pill .tm { color: var(--metric); font-weight: 600; } .pill .tmut { color: var(--muted); }

  .foot { position: absolute; left: 64px; right: 64px; top: 500px; padding-top: 26px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
  .foot img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line-2); }
  .foot b { display: block; font-size: 16px; font-weight: 600; color: var(--head); letter-spacing: -0.01em; }
  .foot small { display: block; margin-top: 3px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .foot .url { margin-left: auto; font-family: var(--mono); font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
  <p class="eyebrow">Writeup · Retrieval</p>

  <h1>Hybrid retrieval for scanned Indonesian contracts</h1>
  <p class="deck">Why vector search can miss exact clause references — and how hybrid retrieval handles them.</p>
  <p class="pill"><span class="tmut">semantic(15) + tfidf(10) →</span> <span class="tm">0.7 / 0.3 + 0.1</span> both-lists bonus</p>

  <div class="foot">
    <img src="../../static/assets/img/portrait.jpg" alt="">
    <span><b>Fadhlillah</b><small>Backend · AI Native Engineer</small></span>
    <span class="url">fadhlillah2.github.io/Bio</span>
  </div>
</body>
</html>
